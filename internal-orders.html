<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internal Orders · Sync Master</title>
</head>
<body>

    <h1>📦 Internal Orders</h1>
    <p><a href="index.html">← Logout</a></p>
    <hr />

    <!-- ===== LAYOUT: SIDEBAR + MAIN ===== -->
    <table border="0" cellpadding="10" cellspacing="0" width="100%">
        <tr>
            <!-- SIDEBAR -->
            <td valign="top" width="220" style="border-right:1px solid #ccc;">
                <h3>Menu</h3>
                <button type="button" id="viewOrdersBtn">📄 See My Orders / History</button>
                <br /><br />
                <button type="button" id="newOrderBtn">➕ Make a New Order</button>
            </td>

            <!-- MAIN CONTENT -->
            <td valign="top">
                <div id="mainContent">
                    <p><em>Select an option from the menu on the left.</em></p>
                </div>

                <!-- ORDERS HISTORY VIEW (hidden by default) -->
                <div id="ordersView" style="display:none;">
                    <h2>📄 My Orders / History</h2>
                    <p>
                        <button type="button" id="refreshOrdersBtn">🔄 Refresh</button>
                        <button type="button" id="closeOrdersBtn">✕ Close</button>
                    </p>
                    <div id="ordersStatus" style="margin:0.5rem 0;"></div>
                    <div id="ordersList"></div>
                </div>

                <!-- NEW ORDER VIEW (placeholder, hidden by default) -->
                <div id="newOrderView" style="display:none;">
                    <h2>➕ Make a New Order</h2>
                    <p><em>New order form will be added here.</em></p>
                    <button type="button" id="closeNewOrderBtn">✕ Close</button>
                </div>
            </td>
        </tr>
    </table>

    <script>
        (function() {
            // ---------- CONFIG ----------
            // Apps Script endpoint for internal orders (replace with your deployed URL)
            const API_URL = 'https://script.google.com/macros/s/AKfycbzzKAmnfCe9O7I56Tb8Fnye-2-GMvpGkyYR574E7uULX2wao9lK77Z9jn6WOiPCZzru/exec';

            // ---------- DOM REFS ----------
            const viewOrdersBtn = document.getElementById('viewOrdersBtn');
            const newOrderBtn = document.getElementById('newOrderBtn');
            const mainContent = document.getElementById('mainContent');
            const ordersView = document.getElementById('ordersView');
            const newOrderView = document.getElementById('newOrderView');
            const ordersList = document.getElementById('ordersList');
            const ordersStatus = document.getElementById('ordersStatus');
            const refreshOrdersBtn = document.getElementById('refreshOrdersBtn');
            const closeOrdersBtn = document.getElementById('closeOrdersBtn');
            const closeNewOrderBtn = document.getElementById('closeNewOrderBtn');

            // ---------- STATE ----------
            let allOrders = [];
            let currentUser = null;

            // ---------- GET LOGGED IN USER (from sessionStorage) ----------
            function getLoggedInUser() {
                try {
                    const raw = sessionStorage.getItem('loggedInUser');
                    if (!raw) return null;
                    return JSON.parse(raw);
                } catch (e) {
                    console.error('Could not parse loggedInUser:', e);
                    return null;
                }
            }

            // ---------- FETCH ORDERS ----------
            async function fetchOrders() {
                ordersStatus.textContent = 'Loading orders…';
                ordersList.innerHTML = '';
                try {
                    // For now, we call a GET endpoint "?action=getOrders"
                    // (we will implement this in Apps Script later)
                    const url = API_URL + '?action=getOrders' +
                                (currentUser && currentUser.userId ? '&userId=' + encodeURIComponent(currentUser.userId) : '');
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const data = await response.json();

                    if (Array.isArray(data)) {
                        allOrders = data;
                    } else {
                        allOrders = [];
                    }
                    renderOrders(allOrders);
                } catch (error) {
                    console.error('Error fetching orders:', error);
                    ordersStatus.textContent = '⚠️ Could not load orders. Showing demo data.';
                    // Fallback demo data so you can see the UI
                    renderOrders(getDemoOrders());
                }
            }

            // ---------- DEMO DATA (fallback so UI is visible) ----------
            function getDemoOrders() {
                return [
                    { id: 'ORD-0001', drug: 'Paracetamol 500 mg', qty: 100, dept: 'Pharmacy', status: 'Pending',   date: '2026-09-01' },
                    { id: 'ORD-0002', drug: 'Amoxicillin 250 mg', qty: 50,  dept: 'Ward A',   status: 'Approved',  date: '2026-08-28' },
                    { id: 'ORD-0003', drug: 'Insulin Mixtard',    qty: 20,  dept: 'ICU',      status: 'Declined',  date: '2026-08-25' },
                    { id: 'ORD-0004', drug: 'Ceftriaxone 1 g',    qty: 30,  dept: 'Theatre',  status: 'Under Review', date: '2026-09-03' }
                ];
            }

            // ---------- RENDER ORDERS ----------
            function renderOrders(orders) {
                if (!orders || orders.length === 0) {
                    ordersStatus.textContent = 'No orders found.';
                    ordersList.innerHTML = '';
                    return;
                }

                ordersStatus.textContent = `${orders.length} order${orders.length !== 1 ? 's' : ''} found.`;

                let html = '<table border="1" cellpadding="6" cellspacing="0" width="100%">';
                html += '<tr>';
                html += '<th>Order ID</th>';
                html += '<th>Drug</th>';
                html += '<th>Qty</th>';
                html += '<th>Department</th>';
                html += '<th>Date</th>';
                html += '<th>Status</th>';
                html += '</tr>';

                orders.forEach(o => {
                    // Status is color-coded using inline styles only (no external CSS)
                    let statusColor = 'black';
                    const statusLower = (o.status || '').toLowerCase();
                    if (statusLower === 'approved') statusColor = 'green';
                    else if (statusLower === 'pending') statusColor = 'orange';
                    else if (statusLower === 'declined') statusColor = 'red';
                    else if (statusLower === 'under review') statusColor = 'blue';

                    html += '<tr>';
                    html += `<td>${o.id || ''}</td>`;
                    html += `<td>${o.drug || ''}</td>`;
                    html += `<td>${o.qty || ''}</td>`;
                    html += `<td>${o.dept || ''}</td>`;
                    html += `<td>${o.date || ''}</td>`;
                    html += `<td style="color:${statusColor}; font-weight:bold;">${o.status || ''}</td>`;
                    html += '</tr>';
                });

                html += '</table>';
                ordersList.innerHTML = html;
            }

            // ---------- VIEW SWITCHING ----------
            function showOrdersView() {
                mainContent.style.display = 'none';
                newOrderView.style.display = 'none';
                ordersView.style.display = 'block';
                viewOrdersBtn.textContent = '✕ Close Orders / History';
                fetchOrders();
            }

            function hideOrdersView() {
                ordersView.style.display = 'none';
                mainContent.style.display = 'block';
                viewOrdersBtn.textContent = '📄 See My Orders / History';
            }

            function showNewOrderView() {
                mainContent.style.display = 'none';
                ordersView.style.display = 'none';
                newOrderView.style.display = 'block';
                newOrderBtn.textContent = '✕ Close New Order';
            }

            function hideNewOrderView() {
                newOrderView.style.display = 'none';
                mainContent.style.display = 'block';
                newOrderBtn.textContent = '➕ Make a New Order';
            }

            // ---------- EVENT LISTENERS ----------
            viewOrdersBtn.addEventListener('click', function() {
                if (ordersView.style.display === 'none') {
                    showOrdersView();
                } else {
                    hideOrdersView();
                }
            });

            newOrderBtn.addEventListener('click', function() {
                if (newOrderView.style.display === 'none') {
                    showNewOrderView();
                } else {
                    hideNewOrderView();
                }
            });

            refreshOrdersBtn.addEventListener('click', fetchOrders);
            closeOrdersBtn.addEventListener('click', hideOrdersView);
            closeNewOrderBtn.addEventListener('click', hideNewOrderView);

            // ---------- INIT ----------
            currentUser = getLoggedInUser();
            if (currentUser) {
                console.log('Logged in as:', currentUser.username);
            } else {
                console.warn('No logged-in user found in sessionStorage.');
            }

        })();
    </script>

</body>
</html>
