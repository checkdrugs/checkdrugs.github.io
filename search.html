<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search · Sync Master</title>
</head>
<body>

    <h1>🔍 Search Online Master</h1>
    <p><a href="index.html">← Logout</a></p>

    <!-- Search Bar -->
    <form id="searchForm">
        <input type="text" id="searchInput" placeholder="Search by drug name…" size="40" />
        <button type="submit" id="searchBtn">Search</button>
        <button type="button" id="filterToggle">☰ Filters</button>
    </form>

    <!-- Filter Options (hidden by default) -->
    <div id="filterOptions" style="display:none; margin-top:0.5rem;">
        <label><input type="checkbox" checked disabled /> ID</label>
        <label><input type="checkbox" checked disabled /> Drug Name</label>
        <label><input type="checkbox" checked disabled /> Form</label>
        <label><input type="checkbox" checked disabled /> Presentation Size</label>
        <label><input type="checkbox" checked disabled /> What It Treats</label>
        <span style="font-size:0.85rem; color:#666;">(Filters not yet active)</span>
    </div>

    <!-- Stats -->
    <div id="searchStats" style="margin:0.5rem 0;"></div>

    <!-- Results Container -->
    <div id="resultsContainer"></div>

    <script>
        (function() {
            // ---------- CONFIGURATION ----------
            // Replace with your actual Apps Script web app URL
            const API_URL = 'https://script.google.com/macros/s/AKfycbzzKAmnfCe9O7I56Tb8Fnye-2-GMvpGkyYR574E7uULX2wao9lK77Z9jn6WOiPCZzru/exec';

            // DOM refs
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const filterToggle = document.getElementById('filterToggle');
            const filterOptions = document.getElementById('filterOptions');
            const searchStats = document.getElementById('searchStats');
            const resultsContainer = document.getElementById('resultsContainer');

            let allData = [];
            let dataLoaded = false;

            // ---------- FETCH DATA (silent) ----------
            async function fetchAllData() {
                if (dataLoaded) return allData;
                try {
                    const response = await fetch(API_URL);
                    const data = await response.json();
                    // Expect data to be an array of arrays (8 columns)
                    if (Array.isArray(data)) {
                        allData = data;
                        dataLoaded = true;
                        return allData;
                    } else {
                        console.error('Unexpected data format:', data);
                        return [];
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    return [];
                }
            }

            // ---------- SEARCH (by drug name only) ----------
            function searchData(query) {
                if (!allData || allData.length === 0) return [];
                if (!query || query.trim() === '') return allData;

                const lowerQuery = query.toLowerCase().trim();
                // Column 2 = Drug Name
                return allData.filter(row => {
                    const drugName = (row[2] || '').toString().toLowerCase();
                    return drugName.includes(lowerQuery);
                });
            }

            // ---------- RENDER RESULTS (plain HTML, no CSS) ----------
            function renderResults(results, query) {
                if (!results || results.length === 0) {
                    resultsContainer.innerHTML = `<p>No results found for "<strong>${query || ''}</strong>"</p>`;
                    searchStats.textContent = '0 results';
                    return;
                }

                let html = '';
                results.forEach(row => {
                    // row: [ID, Drug Class, Drug, Active Ingredients, Presentation, Form, What It Treats, Balance]
                    const id = row[0] || '';
                    const drugClass = row[1] || '';
                    const drug = row[2] || '';
                    const ingredients = row[3] || '';
                    const presentation = row[4] || '';
                    const form = row[5] || '';
                    const treats = row[6] || '';
                    const balance = row[7] || 0;

                    html += `<div style="border:1px solid #ccc; padding:0.5rem; margin:0.5rem 0;">`;
                    html += `<h1 style="margin:0 0 0.2rem 0;">${drug || 'Unnamed Drug'}</h1>`;
                    html += `<h2 style="margin:0 0 0.2rem 0; font-weight:normal;">${form || 'Form not specified'}</h2>`;
                    if (ingredients) html += `<p><strong>Active Ingredients:</strong> ${ingredients}</p>`;
                    if (presentation) html += `<p><strong>Presentation:</strong> ${presentation}</p>`;
                    if (drugClass) html += `<p><strong>Class:</strong> ${drugClass}</p>`;
                    if (treats) html += `<p><strong>Treats:</strong> ${treats}</p>`;
                    html += `<p><strong>Balance:</strong> ${balance}</p>`;
                    if (id) html += `<p style="font-size:0.85rem; color:#555;">ID: ${id}</p>`;
                    html += `</div>`;
                });

                resultsContainer.innerHTML = html;
                searchStats.textContent = `${results.length} result${results.length > 1 ? 's' : ''} found (${allData.length} total)`;
            }

            // ---------- HANDLE SEARCH ----------
            async function handleSearch(e) {
                e.preventDefault();

                const query = searchInput.value.trim();
                if (!query) {
                    resultsContainer.innerHTML = `<p>Please enter a search term.</p>`;
                    searchStats.textContent = '';
                    return;
                }

                // Show loading state
                searchBtn.textContent = 'Searching…';
                searchBtn.disabled = true;

                // Fetch data if not loaded
                if (!dataLoaded) {
                    resultsContainer.innerHTML = `<p>Loading data…</p>`;
                    await fetchAllData();
                }

                const results = searchData(query);
                renderResults(results, query);

                // Restore button
                searchBtn.textContent = 'Search';
                searchBtn.disabled = false;
            }

            // ---------- TOGGLE FILTERS ----------
            filterToggle.addEventListener('click', function() {
                if (filterOptions.style.display === 'none') {
                    filterOptions.style.display = 'block';
                    this.textContent = '✕ Close Filters';
                } else {
                    filterOptions.style.display = 'none';
                    this.textContent = '☰ Filters';
                }
            });

            // ---------- EVENT LISTENERS ----------
            searchForm.addEventListener('submit', handleSearch);

            // Optional: if you want to show all on empty search, you can trigger a search on load with empty query
            // but we'll leave it empty to show a placeholder message.
            // We'll pre-load data in background anyway.
            (function init() {
                // Pre-fetch data silently
                fetchAllData().then(() => {
                    console.log('Data pre-loaded in background.');
                    // Optionally show a message that data is ready
                    searchStats.textContent = `Data ready (${allData.length} records). Enter a search term.`;
                });
            })();

        })();
    </script>

</body>
</html>
