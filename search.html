<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search · Sync Master</title>
</head>
<body>

    <h1>🔍 Search Online Master</h1>
    <p><a href="index.html">← Logout</a></p>

    <!-- Search Bar -->
    <div>
        <input type="text" id="searchInput" placeholder="Search…" size="40" />
        <button type="button" id="searchBtn">Search</button>
        <button type="button" id="filterToggle">☰ Filters</button>
    </div>

    <!-- Floating Column Filter Panel -->
    <div id="filterPanel" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); background:white; border:2px solid #ccc; padding:1.5rem; z-index:999; min-width:300px; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <strong>Search Columns</strong>
            <button type="button" id="closeFilterBtn" style="background:red; color:white; border:none; padding:0.2rem 0.8rem; font-weight:bold; cursor:pointer;">X</button>
        </div>
        <div style="margin-bottom:0.8rem;">
            <label><input type="checkbox" id="selectAll" checked /> Select All</label>
        </div>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
            <label><input type="checkbox" class="filter-checkbox" checked data-col="0" /> ID</label>
            <label><input type="checkbox" class="filter-checkbox" checked data-col="2" /> Drug Name</label>
            <label><input type="checkbox" class="filter-checkbox" checked data-col="5" /> Form</label>
            <label><input type="checkbox" class="filter-checkbox" checked data-col="4" /> Presentation Size</label>
            <label><input type="checkbox" class="filter-checkbox" checked data-col="6" /> What It Treats</label>
        </div>
    </div>

    <!-- Stats & Results -->
    <div id="searchStats" style="margin:0.5rem 0;"></div>
    <div id="resultsContainer"></div>

    <!-- Floating Advanced Filter Panel -->
    <div id="advancedPanel" style="display:none; position:fixed; top:15%; left:50%; transform:translateX(-50%); background:white; border:2px solid #ccc; padding:1.5rem; z-index:999; min-width:320px; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <strong>Advanced Filter</strong>
            <button type="button" id="closeAdvBtn" style="background:red; color:white; border:none; padding:0.2rem 0.8rem; font-weight:bold; cursor:pointer;">X</button>
        </div>
        <div style="margin-bottom:0.8rem;">
            <label><strong>Balance</strong></label><br />
            <select id="balanceFilter" style="width:100%; padding:0.3rem;">
                <option value="all">All</option>
                <option value="gt0">> 0</option>
                <option value="ge100">≥ 100</option>
                <option value="eq0">= 0</option>
            </select>
        </div>
        <div style="margin-bottom:0.8rem;">
            <label><strong>Form</strong></label><br />
            <select id="formFilter" style="width:100%; padding:0.3rem;">
                <option value="all">All Forms</option>
            </select>
        </div>
        <div style="margin-bottom:0.8rem;">
            <label><strong>Presentation Size (contains)</strong></label><br />
            <input type="text" id="presentationFilter" placeholder="e.g. 100 ml" style="width:100%; padding:0.3rem;" />
        </div>
        <div style="display:flex; gap:0.5rem;">
            <button type="button" id="applyAdvFilter" style="background:#1e293b; color:white; border:none; padding:0.4rem 1.5rem; cursor:pointer;">Apply</button>
            <button type="button" id="resetAdvFilter" style="background:#ccc; border:none; padding:0.4rem 1.5rem; cursor:pointer;">Reset</button>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const API_URL = 'https://script.google.com/macros/s/AKfycbzzKAmnfCe9O7I56Tb8Fnye-2-GMvpGkyYR574E7uULX2wao9lK77Z9jn6WOiPCZzru/exec';

            // ---------- DOM REFS ----------
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const filterToggle = document.getElementById('filterToggle');
            const filterPanel = document.getElementById('filterPanel');
            const closeFilterBtn = document.getElementById('closeFilterBtn');
            const selectAll = document.getElementById('selectAll');
            const filterCheckboxes = document.querySelectorAll('.filter-checkbox');
            const searchStats = document.getElementById('searchStats');
            const resultsContainer = document.getElementById('resultsContainer');

            const advancedPanel = document.getElementById('advancedPanel');
            const closeAdvBtn = document.getElementById('closeAdvBtn');
            const balanceFilter = document.getElementById('balanceFilter');
            const formFilter = document.getElementById('formFilter');
            const presentationFilter = document.getElementById('presentationFilter');
            const applyAdvFilter = document.getElementById('applyAdvFilter');
            const resetAdvFilter = document.getElementById('resetAdvFilter');

            let allData = [];
            let dataLoaded = false;
            let currentResults = [];        // original search results (base)
            let filteredResults = [];       // results after advanced filtering
            let currentQuery = '';
            let advancedActive = false;     // true when advanced filters are applied
            let advFilterState = { balance: 'all', form: 'all', presentation: '' }; // for reset

            // ---------- FETCH DATA ----------
            async function fetchAllData() {
                if (dataLoaded) return allData;
                try {
                    console.log('Fetching data from API...');
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('HTTP error ' + response.status);
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        allData = data;
                        dataLoaded = true;
                        console.log('Data loaded: ' + allData.length + ' records');
                        return allData;
                    } else {
                        console.error('Unexpected data format:', data);
                        return [];
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    searchStats.textContent = 'Error loading data. Check console.';
                    return [];
                }
            }

            // ---------- GET SELECTED COLUMNS ----------
            function getSelectedColumns() {
                const cols = [];
                filterCheckboxes.forEach(cb => {
                    if (cb.checked) {
                        cols.push(parseInt(cb.getAttribute('data-col'), 10));
                    }
                });
                return cols;
            }

            // ---------- POPULATE FORM DROPDOWN ----------
            function populateFormDropdown(data) {
                const forms = new Set();
                data.forEach(row => {
                    const form = row[5] ? row[5].toString().trim() : '';
                    if (form) forms.add(form);
                });
                const sorted = Array.from(forms).sort();
                formFilter.innerHTML = '<option value="all">All Forms</option>';
                sorted.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = f;
                    formFilter.appendChild(opt);
                });
            }

            // ---------- SEARCH ----------
            function searchData(query, columns) {
                if (!allData || allData.length === 0) return [];
                if (!query || query.trim() === '') return allData;
                const lowerQuery = query.toLowerCase().trim();
                return allData.filter(row => {
                    for (let col of columns) {
                        const value = (row[col] || '').toString().toLowerCase();
                        if (value.includes(lowerQuery)) {
                            return true;
                        }
                    }
                    return false;
                });
            }

            // ---------- ADVANCED FILTER ----------
            function applyAdvancedFilter(results) {
                let filtered = results.slice();

                const balVal = balanceFilter.value;
                if (balVal !== 'all') {
                    filtered = filtered.filter(row => {
                        const bal = parseFloat(row[7]) || 0;
                        if (balVal === 'gt0') return bal > 0;
                        if (balVal === 'ge100') return bal >= 100;
                        if (balVal === 'eq0') return bal === 0;
                        return true;
                    });
                }

                const formVal = formFilter.value;
                if (formVal !== 'all') {
                    filtered = filtered.filter(row => {
                        const form = row[5] ? row[5].toString().trim() : '';
                        return form === formVal;
                    });
                }

                const presVal = presentationFilter.value.trim();
                if (presVal) {
                    const lowerPres = presVal.toLowerCase();
                    filtered = filtered.filter(row => {
                        const pres = row[4] ? row[4].toString().toLowerCase() : '';
                        return pres.includes(lowerPres);
                    });
                }

                return filtered;
            }

            // ---------- RENDER RESULTS ----------
            function renderResults(results, query, isAdvanced = false, showClear = false) {
                // Remove any existing advanced filter and clear buttons
                const oldAdvBtn = document.getElementById('advancedFilterBtn');
                if (oldAdvBtn) oldAdvBtn.remove();
                const oldClearBtn = document.getElementById('clearAdvBtn');
                if (oldClearBtn) oldClearBtn.remove();

                if (!results || results.length === 0) {
                    resultsContainer.innerHTML = `<p>No results found for "<strong>${query || ''}</strong>"</p>`;
                    if (isAdvanced) {
                        searchStats.textContent = `${results.length} results (filtered from ${currentResults.length})`;
                    } else {
                        searchStats.textContent = '0 results';
                    }
                    return;
                }

                let html = '';
                results.forEach(row => {
                    const id = row[0] || '';
                    const drugClass = row[1] || '';
                    const drug = row[2] || '';
                    const ingredients = row[3] || '';
                    const presentation = row[4] || '';
                    const form = row[5] || '';
                    const treats = row[6] || '';
                    const balance = row[7] || 0;

                    html += `<div style="border:1px solid #ccc; padding:0.5rem; margin:0.5rem 0;">`;
                    html += `<h1 style="margin:0 0 0.2rem 0;">${drug || 'Unnamed Drug'}</h1>`;
                    html += `<h2 style="margin:0 0 0.2rem 0; font-weight:normal;">${form || 'Form not specified'}</h2>`;
                    if (ingredients) html += `<p><strong>Active Ingredients:</strong> ${ingredients}</p>`;
                    if (presentation) html += `<p><strong>Presentation:</strong> ${presentation}</p>`;
                    if (drugClass) html += `<p><strong>Class:</strong> ${drugClass}</p>`;
                    if (treats) html += `<p><strong>Treats:</strong> ${treats}</p>`;
                    html += `<p><strong>Balance:</strong> ${balance}</p>`;
                    if (id) html += `<p style="font-size:0.85rem; color:#555;">ID: ${id}</p>`;
                    html += `</div>`;
                });

                resultsContainer.innerHTML = html;

                // Build stats line with buttons
                let statsText = '';
                if (isAdvanced) {
                    statsText = `${results.length} results (filtered from ${currentResults.length})`;
                } else {
                    statsText = `${results.length} result${results.length > 1 ? 's' : ''} found (${allData.length} total)`;
                }

                // Always show Advanced Filter button if results > 0
                if (results.length > 0) {
                    const advBtn = document.createElement('button');
                    advBtn.id = 'advancedFilterBtn';
                    advBtn.textContent = '⚙️ Advanced Filter';
                    advBtn.style.marginLeft = '1rem';
                    advBtn.style.cursor = 'pointer';
                    searchStats.textContent = statsText;
                    searchStats.appendChild(advBtn);
                    advBtn.addEventListener('click', function() {
                        populateFormDropdown(currentResults);
                        openAdvancedPanel();
                    });

                    // Show Clear button if advanced filters are active
                    if (showClear) {
                        const clearBtn = document.createElement('button');
                        clearBtn.id = 'clearAdvBtn';
                        clearBtn.textContent = '✕ Clear';
                        clearBtn.style.marginLeft = '0.5rem';
                        clearBtn.style.cursor = 'pointer';
                        clearBtn.style.backgroundColor = '#f0f0f0';
                        searchStats.appendChild(clearBtn);
                        clearBtn.addEventListener('click', function() {
                            // Reset advanced filters to defaults
                            balanceFilter.value = 'all';
                            formFilter.value = 'all';
                            presentationFilter.value = '';
                            advancedActive = false;
                            // Show original results
                            renderResults(currentResults, currentQuery, false, false);
                        });
                    }
                } else {
                    searchStats.textContent = statsText;
                }
            }

            // ---------- HANDLE SEARCH ----------
            async function performSearch() {
                const query = searchInput.value.trim();
                currentQuery = query;
                if (!query) {
                    resultsContainer.innerHTML = `<p>Please enter a search term.</p>`;
                    searchStats.textContent = '';
                    const advBtn = document.getElementById('advancedFilterBtn');
                    if (advBtn) advBtn.remove();
                    const clearBtn = document.getElementById('clearAdvBtn');
                    if (clearBtn) clearBtn.remove();
                    advancedActive = false;
                    return;
                }

                searchBtn.textContent = 'Searching…';
                searchBtn.disabled = true;

                if (!dataLoaded) {
                    resultsContainer.innerHTML = `<p>Loading data…</p>`;
                    await fetchAllData();
                }

                const cols = getSelectedColumns();
                const results = searchData(query, cols);
                currentResults = results;
                advancedActive = false;
                renderResults(results, query, false, false);

                searchBtn.textContent = 'Search';
                searchBtn.disabled = false;
            }

            // ---------- TOGGLE COLUMN FILTER PANEL ----------
            function openFilterPanel() {
                filterPanel.style.display = 'block';
                filterToggle.textContent = '✕ Filters';
                filterToggle.style.backgroundColor = 'red';
                filterToggle.style.color = 'white';
                filterToggle.style.border = 'none';
            }

            function closeFilterPanel() {
                filterPanel.style.display = 'none';
                filterToggle.textContent = '☰ Filters';
                filterToggle.style.backgroundColor = '';
                filterToggle.style.color = '';
                filterToggle.style.border = '';
            }

            filterToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (filterPanel.style.display === 'none') {
                    openFilterPanel();
                } else {
                    closeFilterPanel();
                }
            });

            closeFilterBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeFilterPanel();
            });

            // ---------- TOGGLE ADVANCED FILTER PANEL ----------
            function openAdvancedPanel() {
                advancedPanel.style.display = 'block';
                // Optionally close column panel
                closeFilterPanel();
            }

            function closeAdvancedPanel() {
                advancedPanel.style.display = 'none';
            }

            closeAdvBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closeAdvancedPanel();
            });

            // Click outside to close panels
            document.addEventListener('click', function(e) {
                const target = e.target;
                if (filterPanel.style.display !== 'none') {
                    if (!filterPanel.contains(target) && target !== filterToggle && !filterToggle.contains(target)) {
                        closeFilterPanel();
                    }
                }
                if (advancedPanel.style.display !== 'none') {
                    if (!advancedPanel.contains(target) && target.id !== 'advancedFilterBtn') {
                        closeAdvancedPanel();
                    }
                }
            });

            // ---------- SELECT ALL ----------
            selectAll.addEventListener('change', function() {
                const checked = this.checked;
                filterCheckboxes.forEach(cb => cb.checked = checked);
            });

            filterCheckboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const allChecked = Array.from(filterCheckboxes).every(c => c.checked);
                    selectAll.checked = allChecked;
                });
            });

            // ---------- ADVANCED FILTER APPLY / RESET ----------
            applyAdvFilter.addEventListener('click', function() {
                if (!currentResults || currentResults.length === 0) {
                    alert('No results to filter. Please perform a search first.');
                    return;
                }
                const filtered = applyAdvancedFilter(currentResults);
                filteredResults = filtered;
                advancedActive = true;
                renderResults(filtered, currentQuery, true, true);
                closeAdvancedPanel();
            });

            resetAdvFilter.addEventListener('click', function() {
                // Reset controls inside the panel
                balanceFilter.value = 'all';
                formFilter.value = 'all';
                presentationFilter.value = '';
                // Do not change displayed results automatically — user must click Apply again.
                // Optionally, we could reset the displayed results, but we'll keep it consistent with "Apply".
                // However, if we want to reset the view, we can re-render original.
                // For clarity, we'll just reset controls and leave the current view.
                // But the user expects that resetting controls without applying should not affect the view.
                // So we only reset the controls.
                // To be more intuitive, we could also reset the view, but we'll let the user decide.
                // Let's reset the view to the original search results as well.
                if (currentResults.length > 0) {
                    advancedActive = false;
                    renderResults(currentResults, currentQuery, false, false);
                }
                closeAdvancedPanel();
            });

            // ---------- EVENT LISTENERS ----------
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch();
                }
            });

            // ---------- PRE-LOAD DATA ----------
            (function init() {
                fetchAllData().then(() => {
                    console.log('Data pre-loaded.');
                    searchStats.textContent = `Data ready (${allData.length} records). Enter a search term.`;
                });
            })();

        })();
    </script>

</body>
</html>
