<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search</title>
</head>
<body>

    <h1>Search Online Master</h1>
    <a href="index.html">← Logout</a>

    <form id="searchForm" style="display:inline;">
        <input type="text" id="searchInput" placeholder="Search..." />
        <button type="submit">Search</button>
    </form>
    <button id="toggleAllBtn">Show All</button>

    <div id="searchStats"></div>

    <!-- Block view for search results -->
    <div id="blockView"></div>

    <!-- Table view for "Show All" -->
    <div id="tableView" style="display:none;">
        <table border="1" cellpadding="5" cellspacing="0" style="width:100%;border-collapse:collapse;font-family:monospace;font-size:13px;">
            <thead>
                <tr style="background:#f0f0f0;font-weight:bold;">
                    <th>ID</th>
                    <th>Drug Class</th>
                    <th>Drug</th>
                    <th>Active Ingredients</th>
                    <th>Presentation</th>
                    <th>Form</th>
                    <th>Treats</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="8" style="text-align:center;">Loading...</td></tr>
            </tbody>
        </table>

        <!-- Pagination for table view -->
        <div id="pagination" style="margin-top:10px;">
            <button id="prevBtn">← Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextBtn">Next →</button>
        </div>
    </div>

    <script>
        (function() {
            const API_URL = 'https://script.google.com/macros/s/AKfycbzzKAmnfCe9O7I56Tb8Fnye-2-GMvpGkyYR574E7uULX2wao9lK77Z9jn6WOiPCZzru/exec';

            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const searchStats = document.getElementById('searchStats');
            const blockView = document.getElementById('blockView');
            const tableView = document.getElementById('tableView');
            const tableBody = document.getElementById('tableBody');
            const toggleAllBtn = document.getElementById('toggleAllBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');

            let allData = [];
            let dataLoaded = false;
            let isLoading = false;
            let currentPage = 1;
            const ITEMS_PER_PAGE = 15;
            let isTableView = false;

            // ---------- Fetch data silently ----------
            async function fetchAllData() {
                if (dataLoaded) return allData;
                if (isLoading) return allData;

                isLoading = true;
                try {
                    const response = await fetch(API_URL);
                    const data = await response.json();
                    
                    if (Array.isArray(data)) {
                        allData = data;
                        dataLoaded = true;
                        return data;
                    } else if (data && typeof data === 'object') {
                        const values = Object.values(data);
                        for (let val of values) {
                            if (Array.isArray(val)) {
                                allData = val;
                                dataLoaded = true;
                                return val;
                            }
                        }
                        return null;
                    }
                    return null;
                } catch (error) {
                    console.error('Fetch error:', error);
                    return null;
                } finally {
                    isLoading = false;
                }
            }

            // ---------- Search/filter data ----------
            function searchData(query) {
                if (!allData || !allData.length) return [];
                if (!query || query.trim() === '') return allData;

                const lowerQuery = query.toLowerCase().trim();
                
                return allData.filter(row => {
                    let id, drugClass, drug, ingredients, form, treats;
                    
                    if (Array.isArray(row)) {
                        id = (row[0] || '').toString().toLowerCase();
                        drugClass = (row[1] || '').toString().toLowerCase();
                        drug = (row[2] || '').toString().toLowerCase();
                        ingredients = (row[3] || '').toString().toLowerCase();
                        form = (row[5] || '').toString().toLowerCase();
                        treats = (row[6] || '').toString().toLowerCase();
                    } else if (typeof row === 'object') {
                        id = (row.ID || row.id || row[0] || '').toString().toLowerCase();
                        drugClass = (row['Drug Class'] || row.drugClass || row[1] || '').toString().toLowerCase();
                        drug = (row.Drug || row.drug || row[2] || '').toString().toLowerCase();
                        ingredients = (row['Active Ingredients'] || row.ingredients || row[3] || '').toString().toLowerCase();
                        form = (row.Form || row.form || row[5] || '').toString().toLowerCase();
                        treats = (row['What It Treats'] || row.treats || row[6] || '').toString().toLowerCase();
                    } else {
                        return false;
                    }

                    return id.includes(lowerQuery) ||
                           drugClass.includes(lowerQuery) ||
                           drug.includes(lowerQuery) ||
                           ingredients.includes(lowerQuery) ||
                           form.includes(lowerQuery) ||
                           treats.includes(lowerQuery);
                });
            }

            // ---------- Render block view (search results) ----------
            function renderBlockView(results, query) {
                if (!results || results.length === 0) {
                    blockView.innerHTML = `<p>No results found for "${query || ''}"</p>`;
                    searchStats.textContent = '0 results';
                    return;
                }

                let html = '';
                results.forEach(row => {
                    let id, drugClass, drug, ingredients, presentation, form, treats, balance;
                    
                    if (Array.isArray(row)) {
                        id = row[0] || '';
                        drugClass = row[1] || '';
                        drug = row[2] || '';
                        ingredients = row[3] || '';
                        presentation = row[4] || '';
                        form = row[5] || '';
                        treats = row[6] || '';
                        balance = row[7] || 0;
                    } else if (typeof row === 'object') {
                        id = row.ID || row.id || row[0] || '';
                        drugClass = row['Drug Class'] || row.drugClass || row[1] || '';
                        drug = row.Drug || row.drug || row[2] || '';
                        ingredients = row['Active Ingredients'] || row.ingredients || row[3] || '';
                        presentation = row['Presentation Size'] || row.presentation || row[4] || '';
                        form = row.Form || row.form || row[5] || '';
                        treats = row['What It Treats'] || row.treats || row[6] || '';
                        balance = row.Balance || row.balance || row[7] || 0;
                    } else {
                        return;
                    }

                    html += `<div style="border:1px solid #ccc;padding:10px;margin:5px 0;">`;
                    html += `<strong>${drug || 'Unnamed Drug'}</strong><br>`;
                    if (ingredients) html += `Ingredients: ${ingredients}<br>`;
                    if (form) html += `Form: ${form}<br>`;
                    if (presentation) html += `Presentation: ${presentation}<br>`;
                    if (drugClass) html += `Class: ${drugClass}<br>`;
                    if (treats) html += `Treats: ${treats}<br>`;
                    html += `Balance: ${balance}<br>`;
                    if (id) html += `ID: ${id}<br>`;
                    html += `</div>`;
                });

                blockView.innerHTML = html;
                searchStats.textContent = `${results.length} results (${allData.length} total)`;
            }

            // ---------- Render table view (all data) ----------
            function renderTableView(page = 1) {
                const totalPages = Math.ceil(allData.length / ITEMS_PER_PAGE) || 1;
                
                if (page > totalPages) page = totalPages;
                if (page < 1) page = 1;
                currentPage = page;

                const start = (page - 1) * ITEMS_PER_PAGE;
                const end = Math.min(start + ITEMS_PER_PAGE, allData.length);
                const pageItems = allData.slice(start, end);

                // Update stats
                searchStats.textContent = `Showing ${start + 1}-${end} of ${allData.length} records`;

                // Update pagination info
                pageInfo.textContent = `Page ${page} of ${totalPages}`;
                prevBtn.disabled = page <= 1;
                nextBtn.disabled = page >= totalPages;

                // Build table rows
                if (pageItems.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center;">No data available</td></tr>`;
                    return;
                }

                let html = '';
                pageItems.forEach(row => {
                    let id, drugClass, drug, ingredients, presentation, form, treats, balance;
                    
                    if (Array.isArray(row)) {
                        id = row[0] || '';
                        drugClass = row[1] || '';
                        drug = row[2] || '';
                        ingredients = row[3] || '';
                        presentation = row[4] || '';
                        form = row[5] || '';
                        treats = row[6] || '';
                        balance = row[7] || 0;
                    } else if (typeof row === 'object') {
                        id = row.ID || row.id || row[0] || '';
                        drugClass = row['Drug Class'] || row.drugClass || row[1] || '';
                        drug = row.Drug || row.drug || row[2] || '';
                        ingredients = row['Active Ingredients'] || row.ingredients || row[3] || '';
                        presentation = row['Presentation Size'] || row.presentation || row[4] || '';
                        form = row.Form || row.form || row[5] || '';
                        treats = row['What It Treats'] || row.treats || row[6] || '';
                        balance = row.Balance || row.balance || row[7] || 0;
                    } else {
                        return;
                    }

                    html += `<tr>`;
                    html += `<td>${id}</td>`;
                    html += `<td>${drugClass}</td>`;
                    html += `<td><strong>${drug}</strong></td>`;
                    html += `<td>${ingredients}</td>`;
                    html += `<td>${presentation}</td>`;
                    html += `<td>${form}</td>`;
                    html += `<td>${treats}</td>`;
                    html += `<td style="text-align:right;font-weight:bold;">${balance}</td>`;
                    html += `</tr>`;
                });

                tableBody.innerHTML = html;
            }

            // ---------- Toggle between views ----------
            async function toggleView() {
                if (!isTableView) {
                    // Switch to table view
                    if (!dataLoaded) {
                        tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center;">Loading...</td></tr>`;
                        await fetchAllData();
                    }
                    
                    if (allData.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center;">No data available</td></tr>`;
                        return;
                    }
                    
                    renderTableView(1);
                    blockView.style.display = 'none';
                    tableView.style.display = 'block';
                    toggleAllBtn.textContent = 'Hide All';
                    isTableView = true;
                } else {
                    // Switch to block view
                    blockView.style.display = 'block';
                    tableView.style.display = 'none';
                    toggleAllBtn.textContent = 'Show All';
                    isTableView = false;
                    
                    // Clear block view
                    blockView.innerHTML = '';
                    searchStats.textContent = '';
                }
            }

            // ---------- Handle search ----------
            async function handleSearch(e) {
                e.preventDefault();
                
                // If table view is active, switch to block view
                if (isTableView) {
                    toggleView();
                }

                const query = searchInput.value.trim();
                
                // If search is empty, clear results
                if (!query) {
                    blockView.innerHTML = '';
                    searchStats.textContent = '';
                    return;
                }

                // Load data silently if not loaded
                if (!dataLoaded) {
                    blockView.innerHTML = 'Searching...';
                    await fetchAllData();
                }

                const results = searchData(query);
                renderBlockView(results, query);
            }

            // ---------- Pagination navigation ----------
            function prevPage() {
                if (currentPage > 1) {
                    renderTableView(currentPage - 1);
                }
            }

            function nextPage() {
                const totalPages = Math.ceil(allData.length / ITEMS_PER_PAGE);
                if (currentPage < totalPages) {
                    renderTableView(currentPage + 1);
                }
            }

            // ---------- Silently load data in background ----------
            function silentLoad() {
                // Load data in background without showing anything
                fetchAllData().then(data => {
                    if (data && data.length > 0) {
                        console.log(`Silently loaded ${data.length} records`);
                    }
                });
            }

            // ---------- Event listeners ----------
            searchForm.addEventListener('submit', handleSearch);
            toggleAllBtn.addEventListener('click', toggleView);
            prevBtn.addEventListener('click', prevPage);
            nextBtn.addEventListener('click', nextPage);

            // ---------- Initialize - silent background load ----------
            silentLoad();

            // Optional: reload data when page becomes visible (for sync updates)
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    // Silently reload in background when user returns to tab
                    silentLoad();
                }
            });

        })();
    </script>

</body>
</html>
