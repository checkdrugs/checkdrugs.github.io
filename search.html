<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search · Sync Master</title>

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f8;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 0.75rem;
            padding: 2rem 2.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        h1 {
            font-weight: 450;
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .subhead {
            color: #64748b;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subhead a {
            color: #475569;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.3rem 1rem;
            border: 1px solid #dce1e6;
            border-radius: 2rem;
            transition: 0.15s;
        }
        .subhead a:hover {
            background: #f1f4f8;
        }

        /* ---------- SEARCH BAR ---------- */
        .search-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-bar input {
            flex: 1;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            background: white;
            transition: 0.15s;
            min-width: 180px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #4b7b9e;
            box-shadow: 0 0 0 3px rgba(55, 100, 140, 0.15);
        }

        .search-bar button {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.6s ease, color 0.6s ease;
            font-size: 1rem;
            background-color: #1e293b;
            color: white;
        }
        .search-bar button:hover {
            background-color: #0f172a;
        }

        /* ---------- PULSATING ANIMATION ---------- */
        @keyframes pulseColor {
            0%   { background-color: #4CAF50; color: white; }
            25%  { background-color: #66BB6A; color: white; }
            50%  { background-color: #2E7D32; color: white; }
            75%  { background-color: #43A047; color: white; }
            100% { background-color: #4CAF50; color: white; }
        }
        .search-bar button.pulsing {
            animation: pulseColor 1.0s ease-in-out infinite;
            background-color: #4CAF50;
            color: white;
        }

        /* ---------- FILTER SECTION ---------- */
        .filter-section {
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }
        .filter-toggle {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.95rem;
        }
        .filter-toggle:hover {
            background: #0f172a;
        }

        .filter-options {
            display: none;
            flex-wrap: wrap;
            gap: 1.2rem 2rem;
            background: #f8fafc;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            flex: 1;
        }
        .filter-options.open {
            display: flex;
        }
        .filter-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.95rem;
            color: #1e293b;
            cursor: pointer;
        }
        .filter-options input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #1e293b;
        }

        /* ---------- RESULTS PLACEHOLDER ---------- */
        .results-placeholder {
            border: 2px dashed #dce1e6;
            border-radius: 0.5rem;
            padding: 3rem 1.5rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .results-placeholder p {
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        /* small screens */
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            .search-bar { flex-direction: column; align-items: stretch; }
            .filter-options { flex-direction: column; gap: 0.6rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Search Online Master</h1>
    <div class="subhead">
        <span>Find drugs in the database</span>
        <a href="index.html">← Logout</a>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by drug name, ID, ingredients…" />
        <button id="searchBtn">Search</button>
    </div>

    <!-- FILTER TOGGLE & OPTIONS -->
    <div class="filter-section">
        <button class="filter-toggle" id="filterToggle">☰ Filters</button>
        <div class="filter-options" id="filterOptions">
            <label><input type="checkbox" checked /> ID</label>
            <label><input type="checkbox" checked /> Drug Name</label>
            <label><input type="checkbox" checked /> Form</label>
            <label><input type="checkbox" checked /> Presentation Size</label>
            <label><input type="checkbox" checked /> What It Treats</label>
        </div>
    </div>

    <!-- RESULTS PLACEHOLDER -->
    <div class="results-placeholder">
        <div>🔎 Enter a search term and press <strong>Search</strong></div>
        <p>You can also filter which columns to search using the <strong>Filters</strong> button.</p>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM refs ----------
        const searchBtn = document.getElementById('searchBtn');
        const filterToggle = document.getElementById('filterToggle');
        const filterOptions = document.getElementById('filterOptions');

        // ---------- Toggle filter visibility ----------
        filterToggle.addEventListener('click', function() {
            filterOptions.classList.toggle('open');
            // update button text (optional)
            this.textContent = filterOptions.classList.contains('open') ? '✕ Close Filters' : '☰ Filters';
        });

        // ---------- Pulsating animation on search button ----------
        searchBtn.addEventListener('click', function() {
            // Start pulsing
            this.classList.add('pulsing');
            this.textContent = 'Searching…';

            // Simulate a search delay (demo only)
            setTimeout(() => {
                this.classList.remove('pulsing');
                this.textContent = 'Search';
                // In the real version, you would perform the actual search here.
                // For now, just log.
                console.log('Search executed (simulated)');
            }, 2000);
        });

        // Optional: remove pulsing if user clicks again? No, it's fine.

        // ---------- (Demo) initial state ----------
        // filter options hidden by default
        filterOptions.classList.remove('open');
        filterToggle.textContent = '☰ Filters';

        // ---------- (Placeholder) search with Enter key ----------
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });
    })();
</script>

</body>
</html>
