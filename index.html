<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jericho Pharm · Login</title>
</head>
<body>

    <!-- ============================================================ -->
    <!-- WELCOME VIEW                                                  -->
    <!-- ============================================================ -->
    <div id="welcomeView">
        <h1>Welcome to Jericho Pharm</h1>
        <p>
            <button type="button" id="showLoginBtn">Login</button>
            <button type="button" id="showSignupBtn">Sign Up</button>
        </p>
        <hr />
        <p><small>ver 2.0</small></p>
    </div>

    <!-- ============================================================ -->
    <!-- LOGIN VIEW                                                    -->
    <!-- ============================================================ -->
    <div id="loginView" style="display:none;">
        <h1>Login</h1>

        <div>
            <label for="loginUsername">Username</label><br />
            <input type="text" id="loginUsername" size="30" autocomplete="username" />
        </div>

        <div>
            <label for="loginPassword">Password</label><br />
            <input type="password" id="loginPassword" size="30" autocomplete="current-password" />
        </div>

        <p>
            <button type="button" id="loginBtn">Login</button>
            <button type="button" id="backFromLogin">← Back</button>
        </p>

        <div id="loginMessage"></div>

        <hr />
        <p><small>ver 2.0</small></p>
    </div>

    <!-- ============================================================ -->
    <!-- SIGNUP VIEW                                                   -->
    <!-- ============================================================ -->
    <div id="signupView" style="display:none;">
        <h1>Create Account</h1>

        <div>
            <label for="surname">Surname</label><br />
            <input type="text" id="surname" size="30" />
        </div>

        <div>
            <label for="firstName">First Name</label><br />
            <input type="text" id="firstName" size="30" />
        </div>

        <div>
            <label for="otherNames">Other Names (comma separated)</label><br />
            <input type="text" id="otherNames" size="30" placeholder="e.g., John, Mark" />
        </div>

        <div>
            <label for="signupUsername">Username</label><br />
            <input type="text" id="signupUsername" size="30" />
            <button type="button" id="checkUsernameBtn">Check</button>
            <span id="usernameStatus"></span>
        </div>

        <div>
            <label for="email">Email</label><br />
            <input type="email" id="email" size="30" />
            <button type="button" id="checkEmailBtn">Check</button>
            <span id="emailStatus"></span>
        </div>

        <div>
            <label for="phone">Phone Number</label><br />
            <input type="tel" id="phone" size="30" placeholder="e.g. 0704556585 or +254704556585" />
            <button type="button" id="checkPhoneBtn">Check</button>
            <span id="phoneStatus"></span>
        </div>

        <div>
            <label>Alternative Phone(s)</label><br />
            <button type="button" id="addAltPhoneBtn">+ Add Alternative Phone</button>
            <div id="altPhoneContainer"></div>
        </div>

        <div>
            <label for="password">Password</label><br />
            <input type="password" id="password" size="30" autocomplete="new-password" />
        </div>

        <div>
            <label for="confirmPassword">Confirm Password</label><br />
            <input type="password" id="confirmPassword" size="30" autocomplete="new-password" />
            <span id="passwordMatchStatus"></span>
        </div>

        <p>
            <button type="button" id="signupBtn">Create Account</button>
            <button type="button" id="backFromSignup">← Back</button>
        </p>

        <div id="signupMessage"></div>

        <hr />
        <p><small>ver 2.0</small></p>
    </div>

    <script>
        (function() {
            // ============================================================
            // CONFIG
            // ============================================================
            const API_URL = 'https://script.google.com/macros/s/AKfycbzzKAmnfCe9O7I56Tb8Fnye-2-GMvpGkyYR574E7uULX2wao9lK77Z9jn6WOiPCZzru/exec';

            // ============================================================
            // DOM REFS
            // ============================================================
            const welcomeView = document.getElementById('welcomeView');
            const loginView = document.getElementById('loginView');
            const signupView = document.getElementById('signupView');

            const showLoginBtn = document.getElementById('showLoginBtn');
            const showSignupBtn = document.getElementById('showSignupBtn');
            const backFromLogin = document.getElementById('backFromLogin');
            const backFromSignup = document.getElementById('backFromSignup');

            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtn = document.getElementById('loginBtn');
            const loginMessage = document.getElementById('loginMessage');

            const surname = document.getElementById('surname');
            const firstName = document.getElementById('firstName');
            const otherNames = document.getElementById('otherNames');
            const signupUsername = document.getElementById('signupUsername');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const signupBtn = document.getElementById('signupBtn');
            const signupMessage = document.getElementById('signupMessage');

            const usernameStatus = document.getElementById('usernameStatus');
            const emailStatus = document.getElementById('emailStatus');
            const phoneStatus = document.getElementById('phoneStatus');
            const passwordMatchStatus = document.getElementById('passwordMatchStatus');

            const checkUsernameBtn = document.getElementById('checkUsernameBtn');
            const checkEmailBtn = document.getElementById('checkEmailBtn');
            const checkPhoneBtn = document.getElementById('checkPhoneBtn');
            const addAltPhoneBtn = document.getElementById('addAltPhoneBtn');
            const altPhoneContainer = document.getElementById('altPhoneContainer');

            // ============================================================
            // STATE
            // ============================================================
            let allUsers = [];
            let altPhoneCount = 0;

            // ============================================================
            // VIEW SWITCHING
            // ============================================================
            function showWelcome() {
                welcomeView.style.display = 'block';
                loginView.style.display = 'none';
                signupView.style.display = 'none';
                loginMessage.textContent = '';
                signupMessage.textContent = '';
            }
            function showLogin() {
                welcomeView.style.display = 'none';
                loginView.style.display = 'block';
                signupView.style.display = 'none';
                loginMessage.textContent = '';
                setTimeout(() => loginUsername.focus(), 50);
            }
            function showSignup() {
                welcomeView.style.display = 'none';
                loginView.style.display = 'none';
                signupView.style.display = 'block';
                signupMessage.textContent = '';
            }

            // ============================================================
            // UTILITIES
            // ============================================================
            function normalizePhone(input) {
                if (!input) return '';
                let p = input.toString().replace(/\s+/g, '');
                if (p.startsWith('0') && p.length === 10) p = '+254' + p.substring(1);
                else if (p.startsWith('254') && p.length === 12) p = '+' + p;
                return p;
            }

            function isUsernameTaken(username) {
                return allUsers.some(u => u.username && u.username.toLowerCase() === username.toLowerCase());
            }
            function isEmailTaken(emailAddr) {
                return allUsers.some(u => u.email && u.email.toLowerCase() === emailAddr.toLowerCase());
            }
            function isPhoneTaken(phoneNum) {
                const normalized = normalizePhone(phoneNum);
                return allUsers.some(u => u.phone && normalizePhone(u.phone) === normalized);
            }

            function generateUserId() {
                const num = String(Math.floor(Math.random() * 100000000)).padStart(8, '0');
                return 'JB' + num + 'K';
            }

            // ============================================================
            // FETCH USERS
            // ============================================================
            async function fetchUsers() {
                try {
                    const res = await fetch(API_URL + '?action=getUsers');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    allUsers = Array.isArray(data) ? data : [];
                    return allUsers;
                } catch (err) {
                    console.error('Error fetching users:', err);
                    return [];
                }
            }

            // ============================================================
            // AVAILABILITY CHECKS
            // ============================================================
            async function checkUsername() {
                const val = signupUsername.value.trim();
                if (!val) { usernameStatus.textContent = 'Enter a username'; return; }
                usernameStatus.textContent = 'Checking…';
                await fetchUsers();
                if (isUsernameTaken(val)) {
                    usernameStatus.textContent = '❌ Taken';
                } else {
                    usernameStatus.textContent = '✅ Available';
                }
            }

            async function checkEmail() {
                const val = email.value.trim();
                if (!val) { emailStatus.textContent = 'Enter an email'; return; }
                emailStatus.textContent = 'Checking…';
                await fetchUsers();
                if (isEmailTaken(val)) {
                    emailStatus.textContent = '❌ Registered';
                } else {
                    emailStatus.textContent = '✅ Available';
                }
            }

            async function checkPhone() {
                const val = phone.value.trim();
                if (!val) { phoneStatus.textContent = 'Enter a phone'; return; }
                phoneStatus.textContent = 'Checking…';
                await fetchUsers();
                if (isPhoneTaken(val)) {
                    phoneStatus.textContent = '❌ Registered';
                } else {
                    phoneStatus.textContent = '✅ Available';
                }
            }

            // ============================================================
            // SIGNUP
            // ============================================================
            async function handleSignup() {
                signupMessage.textContent = '';
                signupMessage.style.color = '';

                // Basic validation
                if (!surname.value.trim() || !firstName.value.trim()) {
                    signupMessage.textContent = 'Surname and First Name are required.';
                    signupMessage.style.color = 'red';
                    return;
                }
                if (!signupUsername.value.trim() || !email.value.trim() || !phone.value.trim()) {
                    signupMessage.textContent = 'Username, Email and Phone are required.';
                    signupMessage.style.color = 'red';
                    return;
                }
                if (!password.value || password.value !== confirmPassword.value) {
                    signupMessage.textContent = 'Passwords do not match.';
                    signupMessage.style.color = 'red';
                    return;
                }

                // Availability re-check
                await fetchUsers();
                if (isUsernameTaken(signupUsername.value.trim())) {
                    signupMessage.textContent = 'Username already taken.';
                    signupMessage.style.color = 'red';
                    return;
                }
                if (isEmailTaken(email.value.trim())) {
                    signupMessage.textContent = 'Email already registered.';
                    signupMessage.style.color = 'red';
                    return;
                }
                if (isPhoneTaken(phone.value.trim())) {
                    signupMessage.textContent = 'Phone already registered.';
                    signupMessage.style.color = 'red';
                    return;
                }

                // Collect alternative phones
                const altPhones = [];
                document.querySelectorAll('.alt-phone-input').forEach(inp => {
                    if (inp.value.trim()) altPhones.push(normalizePhone(inp.value.trim()));
                });

                const userData = {
                    userId: generateUserId(),
                    surname: surname.value.trim(),
                    firstName: firstName.value.trim(),
                    otherNames: otherNames.value.trim(),
                    username: signupUsername.value.trim(),
                    email: email.value.trim(),
                    phone: normalizePhone(phone.value.trim()),
                    altPhones: altPhones.join(','),
                    password: password.value,
                    createdAt: new Date().toISOString()
                };

                // Button feedback
                signupBtn.textContent = 'Creating…';
                signupBtn.disabled = true;

                try {
                    const params = new URLSearchParams();
                    params.append('action', 'signup');
                    params.append('data', JSON.stringify(userData));
                    const url = API_URL + '?' + params.toString();

                    const res = await fetch(url);
                    const result = await res.json();

                    if (result.success) {
                        // Clear form
                        document.getElementById('surname').value = '';
                        document.getElementById('firstName').value = '';
                        document.getElementById('otherNames').value = '';
                        document.getElementById('email').value = '';
                        document.getElementById('phone').value = '';
                        document.getElementById('password').value = '';
                        document.getElementById('confirmPassword').value = '';
                        altPhoneContainer.innerHTML = '';
                        altPhoneCount = 0;
                        usernameStatus.textContent = '';
                        emailStatus.textContent = '';
                        phoneStatus.textContent = '';
                        passwordMatchStatus.textContent = '';

                        // Prefill login username
                        loginUsername.value = userData.username;
                        loginPassword.value = '';
                        loginMessage.textContent = 'Account created. Please log in.';
                        loginMessage.style.color = 'green';

                        // Switch to login view
                        showLogin();
                    } else {
                        signupMessage.textContent = result.error || 'Signup failed.';
                        signupMessage.style.color = 'red';
                    }
                } catch (err) {
                    console.error('Signup error:', err);
                    signupMessage.textContent = 'Network error: ' + err.message;
                    signupMessage.style.color = 'red';
                } finally {
                    signupBtn.textContent = 'Create Account';
                    signupBtn.disabled = false;
                }
            }

            // ============================================================
            // LOGIN
            // ============================================================
            async function handleLogin() {
                loginMessage.textContent = '';
                loginMessage.style.color = '';

                const username = loginUsername.value.trim();
                const pwd = loginPassword.value.trim();
                if (!username || !pwd) {
                    loginMessage.textContent = 'Please enter username and password.';
                    loginMessage.style.color = 'red';
                    return;
                }

                loginBtn.textContent = 'Logging in…';
                loginBtn.disabled = true;

                if (allUsers.length === 0) await fetchUsers();

                const user = allUsers.find(u =>
                    u.username && u.username.toLowerCase() === username.toLowerCase() &&
                    u.password === pwd
                );

                if (user) {
                    localStorage.setItem('loggedInUser', JSON.stringify(user));
                    loginMessage.textContent = 'Success! Redirecting…';
                    loginMessage.style.color = 'green';
                    setTimeout(() => {
                        window.location.href = 'search.html';
                    }, 500);
                } else {
                    loginMessage.textContent = 'Invalid username or password.';
                    loginMessage.style.color = 'red';
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                }
            }

            // ============================================================
            // ALTERNATIVE PHONE INPUTS
            // ============================================================
            function addAltPhoneInput() {
                altPhoneCount++;
                const wrapper = document.createElement('div');
                wrapper.innerHTML =
                    '<label>Alt Phone ' + altPhoneCount + '</label> ' +
                    '<input type="tel" class="alt-phone-input" size="20" /> ' +
                    '<button type="button" class="remove-alt">✕</button> ' +
                    '<span class="alt-phone-status"></span>';
                altPhoneContainer.appendChild(wrapper);

                wrapper.querySelector('.remove-alt').addEventListener('click', function() {
                    altPhoneContainer.removeChild(wrapper);
                });

                const inp = wrapper.querySelector('.alt-phone-input');
                const status = wrapper.querySelector('.alt-phone-status');
                inp.addEventListener('blur', async function() {
                    if (!this.value.trim()) { status.textContent = ''; return; }
                    await fetchUsers();
                    if (isPhoneTaken(this.value.trim())) {
                        status.textContent = '❌ Registered';
                    } else {
                        status.textContent = '✅ Available';
                    }
                });
            }

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            showLoginBtn.addEventListener('click', showLogin);
            showSignupBtn.addEventListener('click', showSignup);
            backFromLogin.addEventListener('click', showWelcome);
            backFromSignup.addEventListener('click', showWelcome);

            loginBtn.addEventListener('click', handleLogin);
            signupBtn.addEventListener('click', handleSignup);

            checkUsernameBtn.addEventListener('click', checkUsername);
            checkEmailBtn.addEventListener('click', checkEmail);
            checkPhoneBtn.addEventListener('click', checkPhone);
            addAltPhoneBtn.addEventListener('click', addAltPhoneInput);

            // Enter key shortcuts
            loginPassword.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
            loginUsername.addEventListener('keydown', e => { if (e.key === 'Enter') loginPassword.focus(); });
            confirmPassword.addEventListener('keydown', e => { if (e.key === 'Enter') handleSignup(); });

            // Password match feedback
            confirmPassword.addEventListener('input', function() {
                if (!this.value) { passwordMatchStatus.textContent = ''; return; }
                if (this.value === password.value) {
                    passwordMatchStatus.textContent = '✅ Match';
                } else {
                    passwordMatchStatus.textContent = '❌ Do not match';
                }
            });

            // ============================================================
            // INIT
            // ============================================================
            // If already logged in, redirect to search.html
            const existing = localStorage.getItem('loggedInUser');
            if (existing) {
                try {
                    const user = JSON.parse(existing);
                    if (user && user.username) {
                        window.location.href = 'search.html';
                        return;
                    }
                } catch (e) { /* ignore */ }
            }

            // Pre-fetch users in background
            fetchUsers();

            // Default view
            showWelcome();

        })();
    </script>

</body>
</html>
