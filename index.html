<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Sync Master</title>
</head>
<body>

    <!-- ===== LOGIN FORM ===== -->
    <div id="loginView">
        <h1>⏺ Sync Master</h1>
        <p>Login to continue</p>

        <form id="loginForm">
            <div>
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" />
            </div>
            <div>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" />
            </div>
            <div id="loginError" style="color:red;"></div>
            <div id="loginStatus" style="color:#4CAF50; min-height: 20px;"></div>
            <button type="submit" id="loginBtn">Login</button>
            <button type="button" id="showSignupBtn">Create Account</button>
        </form>
    </div>

    <!-- ===== SIGNUP FORM ===== -->
    <div id="signupView" style="display:none;">
        <h1>⏺ Create Account <span style="font-size:0.6em;color:#999;">ver 1.6</span></h1>
        <p>Fill in your details to sign up</p>

        <form id="signupForm">
            <div>
                <label for="surname">Surname</label>
                <input type="text" id="surname" required />
            </div>
            <div>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required />
            </div>
            <div>
                <label for="otherNames">Other Names (comma separated)</label>
                <input type="text" id="otherNames" placeholder="e.g., John, Mark, Peter" />
            </div>
            <div>
                <label for="signupUsername">Username</label>
                <div style="display:flex;gap:5px;align-items:center;max-width:400px;">
                    <input type="text" id="signupUsername" required style="flex:1;" />
                    <button type="button" id="checkUsernameBtn">Check</button>
                </div>
                <span id="usernameStatus"></span>
            </div>
            <div>
                <label for="email">Email</label>
                <div style="display:flex;gap:5px;align-items:center;max-width:400px;">
                    <input type="email" id="email" required style="flex:1;" />
                    <button type="button" id="checkEmailBtn">Check</button>
                </div>
                <span id="emailStatus"></span>
            </div>
            <div>
                <label for="phone">Phone Number</label>
                <div style="display:flex;gap:5px;align-items:center;max-width:400px;">
                    <input type="tel" id="phone" placeholder="e.g., 0704556585 or +254704556585" required style="flex:1;" />
                    <button type="button" id="checkPhoneBtn">Check</button>
                </div>
                <span id="phoneStatus"></span>
            </div>
            <div>
                <label>Alternative Phone Number (optional)</label>
                <button type="button" id="addAltPhoneBtn">+ Add Alternative Phone</button>
                <div id="altPhoneContainer"></div>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" required />
            </div>
            <div>
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required />
                <span id="passwordMatchStatus"></span>
            </div>
            <div id="signupError" style="color:red;"></div>
            <div id="signupStatus" style="color:#4CAF50; min-height: 20px;"></div>
            <div>
                <button type="submit" id="signupSubmitBtn">Sign Up</button>
                <button type="button" id="cancelSignupBtn">Cancel</button>
            </div>
        </form>
    </div>

    <style>
        #signupSubmitBtn, #loginBtn {
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        #signupSubmitBtn.loading, #loginBtn.loading {
            background-color: #4CAF50 !important;
            color: white !important;
        }
        .ellipsis::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
        .checking::after {
            content: '';
            animation: dots 0.8s steps(4, end) infinite;
        }
        .status-available { color: green; }
        .status-taken { color: red; }
        .status-checking { color: #ff9800; }
    </style>

    <script>
        (function() {
            // ===== CONFIGURATION =====
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzzKAmnfCe9O7I56Tb8Fnye-2-GMvpGkyYR574E7uULX2wao9lK77Z9jn6WOiPCZzru/exec';

            // ===== DOM REFS =====
            const loginView = document.getElementById('loginView');
            const signupView = document.getElementById('signupView');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const showSignupBtn = document.getElementById('showSignupBtn');
            const cancelSignupBtn = document.getElementById('cancelSignupBtn');
            const addAltPhoneBtn = document.getElementById('addAltPhoneBtn');
            const altPhoneContainer = document.getElementById('altPhoneContainer');

            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const loginError = document.getElementById('loginError');
            const loginStatus = document.getElementById('loginStatus');
            const loginBtn = document.getElementById('loginBtn');

            const surname = document.getElementById('surname');
            const firstName = document.getElementById('firstName');
            const otherNames = document.getElementById('otherNames');
            const signupUsername = document.getElementById('signupUsername');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const signupError = document.getElementById('signupError');
            const signupStatus = document.getElementById('signupStatus');

            const usernameStatus = document.getElementById('usernameStatus');
            const emailStatus = document.getElementById('emailStatus');
            const phoneStatus = document.getElementById('phoneStatus');
            const passwordMatchStatus = document.getElementById('passwordMatchStatus');
            const signupSubmitBtn = document.getElementById('signupSubmitBtn');

            const checkUsernameBtn = document.getElementById('checkUsernameBtn');
            const checkEmailBtn = document.getElementById('checkEmailBtn');
            const checkPhoneBtn = document.getElementById('checkPhoneBtn');

            let altPhoneCount = 0;
            let allUsers = [];
            let isChecking = false;

            // ===== UTILITY FUNCTIONS =====

            function normalizePhone(phoneNum) {
                if (!phoneNum) return '';
                let cleaned = phoneNum.replace(/\s/g, '');
                if (cleaned.startsWith('0') && cleaned.length === 10) {
                    cleaned = '+254' + cleaned.substring(1);
                } else if (cleaned.startsWith('0') && cleaned.length === 9) {
                    cleaned = '+254' + cleaned.substring(1);
                } else if (cleaned.startsWith('254') && cleaned.length === 12) {
                    cleaned = '+' + cleaned;
                }
                return cleaned;
            }

            function isUsernameTaken(username) {
                return allUsers.some(u => u.username && u.username.toLowerCase() === username.toLowerCase());
            }

            function isEmailTaken(emailAddr) {
                return allUsers.some(u => u.email && u.email.toLowerCase() === emailAddr.toLowerCase());
            }

            function isPhoneTaken(phoneNum) {
                const normalized = normalizePhone(phoneNum);
                return allUsers.some(u => {
                    if (!u.phone) return false;
                    const userPhone = normalizePhone(u.phone);
                    return userPhone === normalized;
                });
            }

            // ===== GENERATE USER ID =====
            function generateUserId() {
                const randomNum = String(Math.floor(Math.random() * 100000000)).padStart(8, '0');
                return 'JB' + randomNum + 'K';
            }

            // ===== FETCH USERS =====
            async function fetchUsers() {
                try {
                    const url = SCRIPT_URL + '?action=getUsers';
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                    const data = await response.json();
                    allUsers = data || [];
                    return allUsers;
                } catch (error) {
                    console.error('Error fetching users:', error);
                    return [];
                }
            }

            // ===== CHECK FUNCTIONS =====
            async function checkUsername() {
                if (isChecking) return;
                isChecking = true;

                const val = signupUsername.value.trim();
                if (!val) {
                    usernameStatus.textContent = 'Please enter a username';
                    usernameStatus.className = 'status-taken';
                    isChecking = false;
                    return;
                }

                usernameStatus.textContent = 'Checking...';
                usernameStatus.className = 'status-checking checking';

                await fetchUsers();

                if (isUsernameTaken(val)) {
                    usernameStatus.textContent = '❌ Username already taken';
                    usernameStatus.className = 'status-taken';
                } else {
                    usernameStatus.textContent = '✅ Username available';
                    usernameStatus.className = 'status-available';
                }
                isChecking = false;
            }

            async function checkEmail() {
                if (isChecking) return;
                isChecking = true;

                const val = email.value.trim();
                if (!val) {
                    emailStatus.textContent = 'Please enter an email';
                    emailStatus.className = 'status-taken';
                    isChecking = false;
                    return;
                }

                emailStatus.textContent = 'Checking...';
                emailStatus.className = 'status-checking checking';

                await fetchUsers();

                if (isEmailTaken(val)) {
                    emailStatus.textContent = '❌ Email already registered';
                    emailStatus.className = 'status-taken';
                } else {
                    emailStatus.textContent = '✅ Email available';
                    emailStatus.className = 'status-available';
                }
                isChecking = false;
            }

            async function checkPhone() {
                if (isChecking) return;
                isChecking = true;

                const val = phone.value.trim();
                if (!val) {
                    phoneStatus.textContent = 'Please enter a phone number';
                    phoneStatus.className = 'status-taken';
                    isChecking = false;
                    return;
                }

                phoneStatus.textContent = 'Checking...';
                phoneStatus.className = 'status-checking checking';

                // Force fetch fresh data
                await fetchUsers();

                // Check against all users directly
                const normalizedVal = normalizePhone(val);
                let taken = false;
                for (let u of allUsers) {
                    if (u.phone) {
                        const userPhone = normalizePhone(u.phone);
                        if (userPhone === normalizedVal) {
                            taken = true;
                            break;
                        }
                    }
                }

                if (taken) {
                    phoneStatus.textContent = '❌ Phone already registered';
                    phoneStatus.className = 'status-taken';
                } else {
                    phoneStatus.textContent = '✅ Phone available';
                    phoneStatus.className = 'status-available';
                }
                isChecking = false;
            }

            // ===== VALIDATE SIGNUP =====
            function validateSignup() {
                let isValid = true;
                signupError.textContent = '';

                if (!surname.value.trim()) {
                    signupError.textContent = 'Surname is required';
                    return false;
                }
                if (!firstName.value.trim()) {
                    signupError.textContent = 'First Name is required';
                    return false;
                }
                if (!signupUsername.value.trim()) {
                    signupError.textContent = 'Username is required';
                    return false;
                }
                if (!email.value.trim()) {
                    signupError.textContent = 'Email is required';
                    return false;
                }
                if (!phone.value.trim()) {
                    signupError.textContent = 'Phone number is required';
                    return false;
                }
                if (!password.value) {
                    signupError.textContent = 'Password is required';
                    return false;
                }
                if (password.value !== confirmPassword.value) {
                    signupError.textContent = 'Passwords do not match';
                    return false;
                }

                if (isUsernameTaken(signupUsername.value.trim())) {
                    signupError.textContent = 'Username is already taken';
                    usernameStatus.textContent = '❌ Username already taken';
                    usernameStatus.className = 'status-taken';
                    isValid = false;
                } else {
                    usernameStatus.textContent = '✅ Username available';
                    usernameStatus.className = 'status-available';
                }

                if (isEmailTaken(email.value.trim())) {
                    if (isValid) signupError.textContent = '';
                    signupError.textContent += (signupError.textContent ? ', ' : '') + 'Email is already registered';
                    emailStatus.textContent = '❌ Email already registered';
                    emailStatus.className = 'status-taken';
                    isValid = false;
                } else {
                    emailStatus.textContent = '✅ Email available';
                    emailStatus.className = 'status-available';
                }

                if (isPhoneTaken(phone.value.trim())) {
                    if (isValid) signupError.textContent = '';
                    signupError.textContent += (signupError.textContent ? ', ' : '') + 'Phone is already registered';
                    phoneStatus.textContent = '❌ Phone already registered';
                    phoneStatus.className = 'status-taken';
                    isValid = false;
                } else {
                    phoneStatus.textContent = '✅ Phone available';
                    phoneStatus.className = 'status-available';
                }

                const altPhones = document.querySelectorAll('.alt-phone-input');
                for (let input of altPhones) {
                    if (input.value.trim() && isPhoneTaken(input.value.trim())) {
                        if (isValid) signupError.textContent = '';
                        signupError.textContent += (signupError.textContent ? ', ' : '') + 'Alternative phone already registered';
                        const statusSpan = input.parentElement.parentElement.querySelector('.alt-phone-status');
                        if (statusSpan) {
                            statusSpan.textContent = '❌ Already registered';
                            statusSpan.className = 'status-taken';
                        }
                        isValid = false;
                    }
                }

                if (!isValid) {
                    signupError.textContent = 'Please fix the issues above';
                    return false;
                }

                signupError.textContent = '';
                return true;
            }

            // ===== SIGNUP SUBMIT =====
            async function handleSignup(e) {
                e.preventDefault();

                // Show loading animation immediately
                signupSubmitBtn.classList.add('loading');
                signupSubmitBtn.textContent = 'Creating Account';
                signupStatus.innerHTML = 'Creating account<span class="ellipsis"></span>';

                try {
                    await fetchUsers();

                    if (!validateSignup()) {
                        signupSubmitBtn.classList.remove('loading');
                        signupSubmitBtn.textContent = 'Sign Up';
                        signupStatus.textContent = '';
                        return;
                    }

                    const altPhones = [];
                    document.querySelectorAll('.alt-phone-input').forEach(input => {
                        if (input.value.trim()) {
                            altPhones.push(normalizePhone(input.value.trim()));
                        }
                    });

                    const userData = {
                        userId: generateUserId(),
                        surname: surname.value.trim(),
                        firstName: firstName.value.trim(),
                        otherNames: otherNames.value.trim(),
                        username: signupUsername.value.trim(),
                        email: email.value.trim(),
                        phone: normalizePhone(phone.value.trim()),
                        altPhones: altPhones.join(','),
                        password: password.value,
                        createdAt: new Date().toISOString()
                    };

                    const params = new URLSearchParams();
                    params.append('action', 'signup');
                    params.append('data', JSON.stringify(userData));
                    const url = SCRIPT_URL + '?' + params.toString();

                    const response = await fetch(url);
                    if (!response.ok) throw new Error('HTTP error! status: ' + response.status);

                    const result = await response.json();

                    if (result.success) {
                        signupStatus.innerHTML = '✅ Account created! Redirecting to login...';
                        signupSubmitBtn.classList.remove('loading');
                        signupSubmitBtn.textContent = '✓ Account Created!';

                        setTimeout(() => {
                            signupView.style.display = 'none';
                            loginView.style.display = 'block';
                            signupForm.reset();
                            signupSubmitBtn.textContent = 'Sign Up';
                            signupSubmitBtn.classList.remove('loading');
                            signupStatus.textContent = '';
                            altPhoneContainer.innerHTML = '';
                            altPhoneCount = 0;
                            usernameStatus.textContent = '';
                            emailStatus.textContent = '';
                            phoneStatus.textContent = '';
                            passwordMatchStatus.textContent = '';
                            loginError.textContent = 'Account created! Please login.';
                            loginError.style.color = 'green';
                            fetchUsers();
                        }, 1500);
                    } else {
                        signupError.textContent = result.error || 'Signup failed';
                        signupSubmitBtn.classList.remove('loading');
                        signupSubmitBtn.textContent = 'Sign Up';
                        signupStatus.textContent = '';
                    }
                } catch (error) {
                    console.error('Signup error:', error);
                    signupError.textContent = 'Network error: ' + error.message;
                    signupSubmitBtn.classList.remove('loading');
                    signupSubmitBtn.textContent = 'Sign Up';
                    signupStatus.textContent = '';
                }
            }

            // ===== LOGIN =====
            async function handleLogin(e) {
                e.preventDefault();

                const username = loginUsername.value.trim();
                const password = loginPassword.value.trim();

                if (!username || !password) {
                    loginError.textContent = 'Please enter username and password';
                    return;
                }

                loginError.textContent = '';

                loginBtn.classList.add('loading');
                loginBtn.textContent = 'Logging In';
                loginStatus.innerHTML = 'Logging in<span class="ellipsis"></span>';

                try {
                    if (allUsers.length === 0) {
                        await fetchUsers();
                    }

                    const user = allUsers.find(u =>
                        u.username && u.username.toLowerCase() === username.toLowerCase() &&
                        u.password === password
                    );

                    if (user) {
                        loginStatus.innerHTML = '✅ Login successful! Redirecting...';
                        sessionStorage.setItem('loggedInUser', JSON.stringify(user));

                        setTimeout(() => {
                            window.location.href = 'search.html';
                        }, 1000);
                    } else {
                        loginError.textContent = 'Invalid username or password';
                        loginError.style.color = 'red';
                        loginBtn.classList.remove('loading');
                        loginBtn.textContent = 'Login';
                        loginStatus.textContent = '';
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    loginError.textContent = 'Network error: ' + error.message;
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = 'Login';
                    loginStatus.textContent = '';
                }
            }

            // ===== REAL-TIME VALIDATION =====
            confirmPassword.addEventListener('input', function() {
                if (this.value && this.value === password.value) {
                    passwordMatchStatus.textContent = '✅ Passwords match';
                    passwordMatchStatus.className = 'status-available';
                } else if (this.value) {
                    passwordMatchStatus.textContent = '❌ Passwords do not match';
                    passwordMatchStatus.className = 'status-taken';
                } else {
                    passwordMatchStatus.textContent = '';
                }
            });

            // ===== ADD ALTERNATIVE PHONE =====
            addAltPhoneBtn.addEventListener('click', function() {
                altPhoneCount++;
                const div = document.createElement('div');
                div.style.marginTop = '5px';
                div.innerHTML = `
                    <label>Alternative Phone ${altPhoneCount}</label>
                    <div style="display:flex;gap:5px;align-items:center;max-width:400px;">
                        <input type="tel" class="alt-phone-input" placeholder="e.g., 0704556585" style="flex:1;" />
                        <button type="button" class="remove-alt-phone">✕</button>
                    </div>
                    <span class="alt-phone-status"></span>
                `;
                altPhoneContainer.appendChild(div);

                const altInput = div.querySelector('.alt-phone-input');
                const altStatus = div.querySelector('.alt-phone-status');

                div.querySelector('.remove-alt-phone').addEventListener('click', function() {
                    altPhoneContainer.removeChild(div);
                    altPhoneCount--;
                });

                altInput.addEventListener('blur', function() {
                    if (this.value.trim()) {
                        if (isPhoneTaken(this.value.trim())) {
                            altStatus.textContent = '❌ Already registered';
                            altStatus.className = 'status-taken';
                        } else {
                            altStatus.textContent = '✅ Available';
                            altStatus.className = 'status-available';
                        }
                    } else {
                        altStatus.textContent = '';
                    }
                });
            });

            // ===== SWITCH VIEWS =====
            showSignupBtn.addEventListener('click', function() {
                loginView.style.display = 'none';
                signupView.style.display = 'block';
                loginError.textContent = '';
                loginStatus.textContent = '';
                fetchUsers();
            });

            cancelSignupBtn.addEventListener('click', function() {
                signupView.style.display = 'none';
                loginView.style.display = 'block';
                signupForm.reset();
                signupError.textContent = '';
                signupStatus.textContent = '';
                usernameStatus.textContent = '';
                emailStatus.textContent = '';
                phoneStatus.textContent = '';
                passwordMatchStatus.textContent = '';
                altPhoneContainer.innerHTML = '';
                altPhoneCount = 0;
                signupSubmitBtn.textContent = 'Sign Up';
                signupSubmitBtn.classList.remove('loading');
            });

            // ===== EVENT LISTENERS =====
            loginForm.addEventListener('submit', handleLogin);
            signupForm.addEventListener('submit', handleSignup);
            checkUsernameBtn.addEventListener('click', checkUsername);
            checkEmailBtn.addEventListener('click', checkEmail);
            checkPhoneBtn.addEventListener('click', checkPhone);

            // ===== INIT =====
            fetchUsers();

        })();
    </script>

</body>
</html>
