<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Sync Master</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-card">
    <h1>⏺ Sync Master</h1>
    <div class="subhead">Local → Online Master</div>

    <form id="loginForm">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" value="admin" placeholder="admin" />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" value="solo" placeholder="solo" />
        </div>

        <button type="submit">→ Access dashboard</button>
        <div id="loginError" class="error-msg"></div>
    </form>

    <div class="footnote">
        <span>default: admin / solo</span>
    </div>
</div>

<!-- Try loading with full path or inline for debugging -->
<script src="login.js"></script>

<!-- Fallback: if login.js fails to load, this inline script will work -->
<script>
    // Backup inline login in case external file fails
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const user = document.getElementById('username').value.trim();
                const pass = document.getElementById('password').value.trim();
                const errorEl = document.getElementById('loginError');
                
                if (user === 'admin' && pass === 'solo') {
                    window.location.href = 'search.html';
                } else {
                    errorEl.textContent = '⛔ invalid username or password';
                }
            });
        }
    });
</script>

</body>
</html>
